<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>

  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
  </body>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    // socket.on('hello' , (message) => {
    //   console.log("message is ::" , message);
    // });


    // socket.on('data' , (arg1 , arg2 , arg3) => {
    //   console.log("arg 1 :::" , arg1);
    //   console.log("arg 2 :::" , arg2);
    //   console.log("arg 3 :::" , arg3);
    // });

    form.addEventListener('submit' , (e) => {
      // console.log("yes submit triggered");
      e.preventDefault();

      if (input.value) {
        //emit fires the event
        socket.emit('chat-message' , input.value);
        input.value = "";
      }
    })

    socket.on('texts' , (text) => {
      // console.log("ITS WORKING");
      const item =  document.createElement('item');
      item.textContent =  text;
      messages.appendChild(item);
      window.scrollTo(0 , document.body.scrollHeight);
    });

    //acknowledgements:
    socket.timeout(2000).emit('request' , 'param1' , 'param2' , (err , res) => {
      if (err) {
        console.log("ERROR OCCURED ::::" , err.message);
      }

      else {
        console.log("response" , res);
      }
    });
  </script>
</html>
